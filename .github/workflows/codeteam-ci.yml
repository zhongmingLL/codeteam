name: codeteam CI

on:
  push:
    branches: [codeteam]
  pull_request:
    branches: [codeteam]

concurrency:
  group: codeteam-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore pinned model data
        run: |
          TARBALL=$(npm pack @earendil-works/pi-ai@1.3.0 --pack-destination "$RUNNER_TEMP" --silent)
          mkdir -p "$RUNNER_TEMP/pi-ai"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/pi-ai"
          rm -rf packages/ai/src/providers/data
          cp -r "$RUNNER_TEMP/pi-ai/package/dist/providers/data" packages/ai/src/providers/data

      - name: Build workspace
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Codeteam tests
        run: npm test --workspace=@codeteam/core
