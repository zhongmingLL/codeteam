id: development
domain: engineering
label: Development SOP
description: >
  codeteam development lane catalog for WorkflowSop. Stage ids are bulletin-board
  lanes, not a mandatory serial pipeline. Risk decides which lanes and gates are
  used; only completion and evidence-backed checks have write gates.
checks:
  - name: remoteMainSynced
    evidenceKind: git_sync
    label: base branch is synced with its remote
  - name: qualityGatePassed
    evidenceKind: quality_gate
    label: risk-matched quality gate has fresh evidence
  - name: reviewApproved
    evidenceKind: review
    label: independent review approved the exact HEAD
  - name: visionGuardDone
    evidenceKind: vision_guard
    label: non-author non-reviewer vision guard accepted the result
stages:
  - id: kickoff
    label: 立项（按需）
    suggested_skill: feat-lifecycle
    hard_rules:
      - id: kickoff-ac-checklist
        text: Feature spec 必须有 AC + 需求点 checklist；没有确认不开始实现
        severity: blocker
        predicate:
          type: manual_only
          reason: Spec completeness and operator intent are semantic; the design gate consumes structured evidence when available.
    pitfalls:
      - id: kickoff-no-unconfirmed-implementation
        text: 没有 operator 确认就直接开始实现
        severity: warn
        predicate:
          type: manual_only
          reason: Operator confirmation is conversational intent, not yet a structured event.

  - id: impl
    label: 实现隔离（按需）
    suggested_skill: worktree
    hard_rules:
      - id: impl-main-sync-before-worktree
        text: worktree 开之前 base branch 必须与 remote 双向同步（ahead=0 behind=0）
        severity: blocker
        predicate:
          type: git_state_predicate
          repository: current
          branch_from: task.base_ref
          checks: [ahead_zero, behind_zero]
          before_command: git worktree add
      - id: impl-risk-route-before-action
        text: 实现前必须按 behavior/data/security/contract/irreversible 五轴判断风险，不能机械套用或跳过流程
        severity: blocker
        predicate:
          type: manual_only
          reason: Risk classification is semantic; concrete safety and contract boundaries are enforced by point gates after the lane is selected.
          future_candidate: risk_route_attestation
      - id: impl-design-gate-evidence
        text: 触及 public route/consumer/canonical helper 时必须有 design gate 或 spec+AC 证据
        severity: blocker
        predicate:
          type: design_gate_evidence
          consumer_globs:
            - packages/*/src/**/*route*.ts
            - packages/*/src/**/*consumer*.ts
            - packages/*/src/**/*caller*.ts
            - packages/*/src/control/**/*.ts
            - packages/*/src/auth/**/*.ts
            - packages/*/src/gates/**/*.ts
            - packages/*/src/review/**/*.ts
          canonical_helper_pattern: "\\b(?:auth|authoriz|ownership|policy|resolver|gate|evidence|review|merge)\\w*\\b"
    pitfalls:
      - id: impl-post-compact-recall-loss
        text: 压缩后先读 resumeCapsule，不凭记忆继续
        severity: warn
        predicate:
          type: manual_only
          reason: No stable post-compact recall-failure telemetry yet.
      - id: impl-convention-graph-before-convention-edit
        text: 改已索引约定面前先查 consumer/影响面
        severity: warn
        predicate:
          type: manual_only
          reason: codeteam has no convention-graph CLI in v1; use grep/tsc/tests as the explicit consumer census.

  - id: quality_gate
    label: 自检（按风险）
    suggested_skill: quality-gate
    hard_rules:
      - id: quality-gate-vision-coverage
        text: 自检报告必须包含愿景覆盖度和实际用户结果
        severity: blocker
        predicate:
          type: manual_only
          reason: Vision coverage needs author/reviewer judgment; evidence is recorded as an artifact or SOP check.
      - id: quality-gate-risk-matched-evidence
        text: 宣称完成必须有与影响面匹配的 fresh 验证证据；空测试集合不算证据
        severity: blocker
        predicate:
          type: command_pattern
          must_match: npm test|npm run build:offline|npx tsc|node --test|npm --prefix .* test|git diff --check
          reason: Command evidence is necessary but not sufficient; author and reviewer still judge test value.
    pitfalls:
      - id: quality-gate-fake-green
        text: 用无关 passing test 或 schema 存在冒充功能可用
        severity: blocker
        predicate:
          type: manual_only
          reason: Test relevance and product usability require human/agent judgment.

  - id: fresh_context
    label: Fresh-Context Pre-Review
    suggested_skill: fresh-context-review
    optional: true
    hard_rules: []
    pitfalls:
      - id: fresh-context-not-approval
        text: Fresh-context 是 finding generator，不是 approval authority；不产出 verdict
        severity: warn
        predicate:
          type: manual_only
          reason: Fresh-context output is a finding list, not a structured verdict.

  - id: review
    label: 独立验证（按风险择源）
    suggested_skill: request-review
    hard_rules:
      - id: review-no-self-review
        text: 同一个体不能 review 自己的代码；代码 review 默认跨 model family
        severity: blocker
        predicate:
          type: handle_check
          constraint: reviewer_not_author
      - id: review-exact-head
        text: review verdict 必须覆盖最终实质 HEAD；HEAD/base 变化只触发 provenance 判定，不自动 re-review
        severity: blocker
        predicate:
          type: manual_only
          reason: Exact HEAD and continuity are enforced by the review gate against reviews/verifications tables.
      - id: review-original-requirements
        text: 涉及用户意图或愿景的 review 必须回读原始需求，不只看作者摘要
        severity: blocker
        predicate:
          type: manual_only
          reason: Review packet content is free-form; the reviewer is responsible for reading the original source.
    pitfalls:
      - id: review-report-on-branch
        text: verdict 之后不得向被审分支提交 review report（SHA 自噬环）
        severity: blocker
        predicate:
          type: manual_only
          reason: Carrier discipline is judged from the PR/thread, not a stable command predicate.

  - id: merge
    label: 合入（gate 后 merge owner）
    suggested_skill: merge-gate
    hard_rules:
      - id: merge-gate-five
        text: merge gate 五条必须同时成立；5 条是证据清单，不是 merge 执行授权
        severity: blocker
        predicate:
          type: manual_only
          reason: The merge gate service evaluates exact HEAD, review provenance, verification closure and risk consistency; operator hard gates stay separate.
      - id: merge-owner-executes
        text: routine merge 由 service:merge-owner 在 gate 后执行；hard gate 才要 accepted merge approval
        severity: blocker
        predicate:
          type: manual_only
          reason: Enforced by the local MergeExecutor and receipt contract.
      - id: merge-no-local-squash-close
        text: 禁止本地 squash + push + close PR 冒充 merged；merge receipt 必须对应真实 merge SHA
        severity: blocker
        predicate:
          type: command_sequence
          anti_pattern:
            - git push
            - gh pr close
          absent:
            - git merge
            - gh pr merge
      - id: merge-main-live-truth
        text: 合入 main 不等于部署；触及 live surface 时分开声明 main 和 live
        severity: blocker
        predicate:
          type: manual_only
          reason: Runtime activation is an external truth; W4 only records merge receipt.
    pitfalls:
      - id: merge-operator-hard-gate
        text: 第三方 PR、不可逆 Git、close feat、圣域/生产数据、runtime 生命周期、凭证/secret、外部发布必须 operator
        severity: blocker
        predicate:
          type: manual_only
          reason: Hard-gate classification is semantic; the merge CLI requires an explicit hard-gate flag and accepted approval.

  - id: completion
    label: 愿景守护（终态触发）
    suggested_skill: feat-lifecycle
    hard_rules:
      - id: completion-vision-guard
        text: completion 需要独立愿景守护（非作者非 reviewer）+ acceptance + merge receipt
        severity: blocker
        predicate:
          type: manual_only
          reason: "Enforced by the completion gate: backlog done, operator actor, fresh vision_guard evidence and succeeded merge receipt."
      - id: completion-not-task-done
        text: task done 不等于 feature completion；completion 只挂 backlog item
        severity: blocker
        predicate:
          type: manual_only
          reason: WorkflowSop keyed by backlogItemId; task.done does not write stage.
    pitfalls:
      - id: completion-without-truth-sync
        text: close 前 feature doc / backlog / merge receipt 必须说真话
        severity: blocker
        predicate:
          type: manual_only
          reason: Truth sync is a human/agent semantic check.

